name: WordChef Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static frontend for Android WebView
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          WORDCHEF_ANDROID=1 npm run build
          test -f out/index.html

      - name: Copy frontend export into Android assets
        run: |
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -R ../frontend/out/. app/src/main/assets/www/
          test -f app/src/main/assets/www/index.html
          test -d app/src/main/assets/www/_next

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify WebView assets in APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "assets/www/index.html|assets/www/_next/" | head -20
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/www/index.html"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/wordchef-v1.4.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordchef-v1.4.0-apk
          path: android/app/build/outputs/apk/debug/wordchef-v1.4.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to v1.4.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.4.0 app/build/outputs/apk/debug/wordchef-v1.4.0.apk --repo "${{ github.repository }}" --clobber
