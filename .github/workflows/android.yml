name: WordChef Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/wordchef-v1.4.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordchef-v1.4.0-apk
          path: android/app/build/outputs/apk/debug/wordchef-v1.4.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to v1.4.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.4.0 app/build/outputs/apk/debug/wordchef-v1.4.0.apk --repo "${{ github.repository }}" --clobber
