name: WordChef Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static frontend for Android WebView
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f out/index.html

      - name: Copy frontend export into Android assets
        run: |
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -R ../frontend/out/. app/src/main/assets/www/
          test -f app/src/main/assets/www/index.html
          test -d app/src/main/assets/www/_next

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair -v             -keystore keystore.jks             -storepass wordchef             -keypass wordchef             -alias wordchef             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Word Chef, OU=Android, O=Word Chef, L=Kyiv, ST=Kyiv, C=UA"

      - name: Build signed release APK
        env:
          WC_KEYSTORE_PASS: wordchef
          WC_KEY_ALIAS: wordchef
          WC_KEY_PASS: wordchef
        run: gradle assembleRelease --no-daemon

      - name: Align and re-sign release APK
        env:
          WC_KEYSTORE_PASS: wordchef
          WC_KEY_ALIAS: wordchef
          WC_KEY_PASS: wordchef
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          INPUT="app/build/outputs/apk/release/app-release.apk"
          OUTPUT="app/build/outputs/apk/release/wordchef-v1.6.0.apk"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          test -s "$INPUT"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$INPUT" "$OUTPUT"
          "$BUILD_TOOLS/apksigner" sign             --ks keystore.jks             --ks-pass pass:"$WC_KEYSTORE_PASS"             --key-pass pass:"$WC_KEY_PASS"             --ks-key-alias "$WC_KEY_ALIAS"             "$OUTPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 26 "$OUTPUT"

      - name: Verify WebView assets in APK
        run: |
          unzip -l app/build/outputs/apk/release/wordchef-v1.6.0.apk | grep -E "assets/www/index.html|assets/www/_next/" | head -20
          unzip -l app/build/outputs/apk/release/wordchef-v1.6.0.apk | grep -q "assets/www/index.html"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordchef-v1.6.0-apk
          path: android/app/build/outputs/apk/release/wordchef-v1.6.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release v1.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v1.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v1.6.0 --repo "$GITHUB_REPOSITORY" --title "Word Chef v1.6.0" --generate-notes

      - name: Upload APK to v1.6.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.6.0 app/build/outputs/apk/release/wordchef-v1.6.0.apk --repo "${GITHUB_REPOSITORY}" --clobber
